services:

  server:
    build:
      context: ./server
    container_name: student-management-server
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: student-management-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped